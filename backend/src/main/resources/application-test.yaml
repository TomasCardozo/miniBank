spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,flyway
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

minibank:
  jwt:
    secret: test-secret-change-before-real-use
    expiration: 3600000
